<!DOCTYPE html>
<html>
<head>
<style>
html,body{height:100%;width:100%}html{display:table;margin:auto;}body{display:table-cell;vertical-align:middle;}
body{font-size: 64px}
table,th,td{border:1px solid black}
table{width:100%;height:33.33333%}
tr{height:33.33333%;width:100%}
td{width:11.11111%}
</style>
<script>


function randomChoice(array) {
	let choice = Math.floor(Math.random()*array.length);
	return array.splice(choice, 1);
}

function main() {
let card = [[],[],[]];
for (let j = 0; j < 9; j++) {
let numLeft = [];
for (let k = 1; k <= 10; k++){
numLeft.push(10*j + k);
}
let choices = []
for (let i = 0; i < 3; i++) {
choices.push(randomChoice(numLeft));
}
choices.sort();
for (let i = 0; i < 3; i++){
card[i][j] = choices[i];
}
}
for (let i = 0; i < 3; i++) {
let row = [0, 0, 0, 0, 1, 1, 1, 1, 1];
for (let j = 0; j < 9; j++) {
let hasNum = randomChoice(row);
let num = card[i][j];
let cell = document.getElementById(`row${i}col${j}`);
cell.style.color = "black";
cell.style.backgroundColor = "white";
cell.style.textAlign = "center";
if (hasNum == 0) {
cell.style.backgroundColor = "blue";
cell.style.color = "blue";
cell.innerText = "00";
} else {
cell.innerText = num;
cell.onclick = function() {
if (cell.style.color === "black") {
cell.style.color = "white";
cell.style.backgroundColor = "blue";
} else {
cell.style.color = "black";
cell.style.backgroundColor = "white";
}
}
}
}	
}
}

document.addEventListener("DOMContentLoaded", main);
</script>
</head>
<body>
<table>
<tr>
	<td id="row0col0"></td>
	<td id="row0col1"></td>
	<td id="row0col2"></td>
	<td id="row0col3"></td>
	<td id="row0col4"></td>
	<td id="row0col5"></td>
	<td id="row0col6"></td>
	<td id="row0col7"></td>
	<td id="row0col8"></td>
</tr>
<tr>
        <td id="row1col0"></td>
        <td id="row1col1"></td>
        <td id="row1col2"></td>
        <td id="row1col3"></td>
        <td id="row1col4"></td>
        <td id="row1col5"></td>
        <td id="row1col6"></td>
        <td id="row1col7"></td>
	<td id="row1col8"></td>
</tr>
<tr>
        <td id="row2col0"></td>
        <td id="row2col1"></td>
        <td id="row2col2"></td>
        <td id="row2col3"></td>
        <td id="row2col4"></td>
        <td id="row2col5"></td>
        <td id="row2col6"></td>
        <td id="row2col7"></td>
	<td id="row2col8"></td>
</tr>
</table>
</body>
</html>
