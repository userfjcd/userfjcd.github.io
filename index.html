<html>
	<head>
		<script>
let numbersLeft = [];
for (let i = 1; i < 91; i++) {
	numbersLeft.push(i);
}

let numbersList = [];

function nextNumber() {
	let choice = Math.floor(Math.random()*numbersLeft.length);
	let currentNumber = numbersLeft[choice];
	numbersLeft.splice(choice, 1);
	numbersList.push(currentNumber);
	document.getElementById("currentNumber").innerText = currentNumber;
	document.getElementById("numbersList").innerText += `\t${currentNumber}`;
}

function searchNumber() {
	let value = document.getElementById("searchNumber").value;
	let result = numbersList.indexOf(parseInt(value))===-1?"NO":"YES";
	document.getElementById("result").innerText = result;
}

function main() {
	document.getElementById("next").addEventListener("click", nextNumber);
	document.getElementById("searchButton").addEventListener("click", searchNumber);
}

document.addEventListener("DOMContentLoaded", main);
		</script>
	</head>
	<body>
		<h1 id="currentNumber"></h1><br/>
		<button id="next">Next</button><br/>
		<form id="search">
			<input id="searchNumber" name="searchNumber"/>
		</form>
		<button id="searchButton">Search</button>
		<p id="result"></p><br/>
		<p id="numbersList"></p>
	</body>
</html>
